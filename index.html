    <script>
      // Compatibility shim for browser extensions/interceptors attempting to override window.fetch
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function(newFetch) { originalFetch = newFetch; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            window.fetch = window.fetch;
          } catch (err) {}
        }
      })();
    </script>
